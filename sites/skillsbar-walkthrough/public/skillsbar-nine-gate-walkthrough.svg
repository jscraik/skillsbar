    <rect x="28" y="326" width="584" height="74" rx="14" fill="#191d22"/>
    <text x="48" y="355" class="label">NEXT ACTION</text><text x="48" y="383" class="action">Inspect risk modes</text>
    <rect x="544" y="343" width="46" height="42" rx="11" fill="#252a31" stroke="#56606c"/><path d="M560 356h14v17h-14zM566 351h14v17" fill="none" stroke="#dce1e8" stroke-width="2.5"/>
  </g>

