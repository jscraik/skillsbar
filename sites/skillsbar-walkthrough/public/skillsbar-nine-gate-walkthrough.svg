    <text x="28" y="130" class="label">NOW CHECKING</text>
    <text x="28" y="164" class="row-key">Risk modes</text><text x="612" y="164" text-anchor="end" class="row-value">destructive · credentials · external</text>
    <text x="28" y="196" class="row-key">Guardrail coverage</text><text x="612" y="196" text-anchor="end" class="row-warn">advisory preview</text>
    <text x="28" y="228" class="row-key">Candidate binding</text><text x="612" y="228" text-anchor="end" class="row-red">UNVERIFIED</text>
    <text x="28" y="260" class="row-key">Disposition</text><text x="612" y="260" text-anchor="end" class="row-red">HUMAN REVIEW</text>
