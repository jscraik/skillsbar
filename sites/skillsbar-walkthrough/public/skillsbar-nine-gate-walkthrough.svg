    <text x="48" y="355" class="label">NEXT ACTION</text><text x="48" y="383" class="action">Attach publication + score receipts</text><rect x="544" y="343" width="46" height="42" rx="11" fill="#1b3035" stroke="#2d7d8c"/><path d="M560 356h14v17h-14zM566 351h14v17" fill="none" stroke="#dce1e8" stroke-width="2.5"/>
