  <text x="135" y="1640" class="footer"><tspan fill="#48e58a">PASSED</tspan> = current receipt  ·  <tspan fill="#ff6b5e">REVIEW</tspan> = human attention  ·  <tspan fill="#ffb520">HELD</tspan> = earlier gate incomplete  ·  <tspan fill="#ffb520">UNPROVEN</tspan> = receipt absent  ·  <tspan fill="#a3aabb">STALE</tspan> = digest mismatch</text>
  <text x="60" y="1690" class="footer">Concept walkthrough · generated/mockup media is not runtime proof · registry observation stays separate from candidate publication evidence.</text>
