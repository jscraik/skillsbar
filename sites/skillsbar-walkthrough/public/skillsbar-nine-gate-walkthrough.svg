<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1750" viewBox="0 0 2160 1750" role="img" aria-labelledby="title description">
  <title id="title">SkillsBar nine-gate candidate proof walkthrough</title>
  <desc id="description">A dark macOS-style design board showing the nine sections of the SkillsBar candidate-proof pipeline, each expanded with its information, evidence source, and next action.</desc>
  <defs>
    <style>
      .page { fill:#090b0e; }
      .card { fill:#111418; stroke:#2c3239; stroke-width:2; }
      .card-active { fill:#121416; stroke:#ff5f52; stroke-width:3; }
      .topline { fill:#9ca4b4; font:600 19px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; letter-spacing:1.25px; }
      .package { fill:#c0c7d5; font:500 19px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .title { fill:#f4f5f7; font:700 28px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .headline { fill:#c7ced9; font:500 22px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .headline-red { fill:#ff6b5e; font:650 22px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .label { fill:#929baa; font:650 15px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; letter-spacing:1.1px; }
      .row-key { fill:#929baa; font:500 17px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .row-value { fill:#eef0f4; font:600 17px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .row-pass { fill:#48e58a; font:700 17px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .row-warn { fill:#ffb520; font:700 17px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .row-red { fill:#ff6b5e; font:700 17px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .row-cyan { fill:#2ed4ed; font:700 17px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .source { fill:#7e8999; font:500 15px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .action { fill:#dde2ea; font:600 16px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .badge { font:750 14px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; letter-spacing:1px; }
      .footer { fill:#8c96a5; font:500 16px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .footer-strong { fill:#d7dce4; font:600 16px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
      .divider { stroke:#303842; stroke-width:1.5; }
    </style>
  </defs>
  <rect class="page" x="0" y="0" width="2160" height="1750" rx="0"/>

  <text x="60" y="64" class="topline">SKILLS SDK</text>
  <text x="60" y="110" class="title" style="font-size:38px">Nine-gate candidate proof walkthrough</text>
  <text x="60" y="143" class="package">jscraik/improve-agent-native  ·  LOCAL  ·  v0.2.0  ·  each card shows the active gate, its evidence, and the next action</text>
  <line x1="60" y1="165" x2="2100" y2="165" class="divider"/>

  <!-- Gate 1 -->
  <g transform="translate(60,195)">
    <rect class="card-active" width="640" height="430" rx="24"/>
    <circle cx="45" cy="45" r="25" fill="#221517" stroke="#ff5f52" stroke-width="3"/>
    <text x="45" y="52" text-anchor="middle" class="headline-red" style="font-size:22px">1</text>
    <text x="86" y="40" class="title">Candidate identity</text>
    <rect x="482" y="20" width="130" height="32" rx="16" fill="#33191b" stroke="#ff5f52"/>
    <text x="547" y="42" text-anchor="middle" class="badge" fill="#ff6b5e">REVIEW</text>
    <text x="86" y="76" class="headline-red">Canonical package digest unavailable</text>
    <line x1="28" y1="100" x2="612" y2="100" class="divider"/>
    <text x="28" y="130" class="label">NOW CHECKING</text>
    <text x="28" y="164" class="row-key">Selected skill</text><text x="612" y="164" text-anchor="end" class="row-value">improve-agent-native/SKILL.md</text>
    <text x="28" y="196" class="row-key">Governed inputs</text><text x="612" y="196" text-anchor="end" class="row-value">skill · risk modes · scenarios</text>
    <text x="28" y="228" class="row-key">Candidate digest</text><text x="612" y="228" text-anchor="end" class="row-red">MISSING</text>
    <text x="28" y="260" class="row-key">Downstream proof</text><text x="612" y="260" text-anchor="end" class="row-warn">HELD</text>
    <text x="28" y="302" class="source">EVIDENCE SOURCE  ·  Canonical SDK package build</text>
    <rect x="28" y="326" width="584" height="74" rx="14" fill="#191d22" stroke="#4d2525"/>
    <text x="48" y="355" class="label">NEXT ACTION</text><text x="48" y="383" class="action">Build package identity</text>
    <rect x="544" y="343" width="46" height="42" rx="11" fill="#252a31" stroke="#56606c"/>
    <path d="M560 356h14v17h-14zM566 351h14v17" fill="none" stroke="#dce1e8" stroke-width="2.5"/>
  </g>

  <!-- Gate 2 -->
  <g transform="translate(760,195)">
    <rect class="card" width="640" height="430" rx="24"/>
    <circle cx="45" cy="45" r="25" fill="#2a2113" stroke="#ffb520" stroke-width="3"/>
    <text x="45" y="52" text-anchor="middle" class="row-warn" style="font-size:22px">2</text>
    <text x="86" y="40" class="title">Mechanical validation</text>
    <rect x="447" y="20" width="165" height="32" rx="16" fill="#342814" stroke="#ffb520"/>
    <text x="529" y="42" text-anchor="middle" class="badge" fill="#ffb520">PARTIAL 1 / 2</text>
    <text x="86" y="76" class="headline">Package verifies; strict audit required</text>
    <line x1="28" y1="100" x2="612" y2="100" class="divider"/>
    <text x="28" y="130" class="label">NOW CHECKING</text>
    <text x="28" y="164" class="row-key">Package verify</text><text x="612" y="164" text-anchor="end" class="row-pass">PASSED</text>
    <text x="28" y="196" class="row-key">Strict audit</text><text x="612" y="196" text-anchor="end" class="row-red">MISSING</text>
    <text x="28" y="228" class="row-key">Receipt binding</text><text x="612" y="228" text-anchor="end" class="row-value">candidate digest required</text>
    <text x="28" y="260" class="row-key">Contribution</text><text x="612" y="260" text-anchor="end" class="row-warn">0 / 10 until complete</text>
    <text x="28" y="302" class="source">EVIDENCE SOURCE  ·  Package verify + strict audit receipts</text>
    <rect x="28" y="326" width="584" height="74" rx="14" fill="#191d22"/>
    <text x="48" y="355" class="label">NEXT ACTION</text><text x="48" y="383" class="action">Run strict audit</text>
    <rect x="544" y="343" width="46" height="42" rx="11" fill="#252a31" stroke="#56606c"/><path d="M560 356h14v17h-14zM566 351h14v17" fill="none" stroke="#dce1e8" stroke-width="2.5"/>
  </g>

  <!-- Gate 3 -->
  <g transform="translate(1460,195)">
    <rect class="card" width="640" height="430" rx="24"/>
    <circle cx="45" cy="45" r="25" fill="#28191a" stroke="#ff6b5e" stroke-width="3"/>
    <text x="45" y="52" text-anchor="middle" class="headline-red" style="font-size:22px">3</text>
    <text x="86" y="40" class="title">Security &amp; guardrails</text>
    <rect x="482" y="20" width="130" height="32" rx="16" fill="#33191b" stroke="#ff5f52"/>
    <text x="547" y="42" text-anchor="middle" class="badge" fill="#ff6b5e">REVIEW</text>
    <text x="86" y="76" class="headline">Risk taxonomy observed; receipt missing</text>
