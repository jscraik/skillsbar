    <text x="28" y="228" class="row-key">Quality / impact</text><text x="612" y="228" text-anchor="end" class="row-cyan">100% / 63%</text>
    <text x="28" y="260" class="row-key">Security / visibility</text><text x="612" y="260" text-anchor="end" class="row-cyan">Passed / Private</text>
