    <text x="28" y="260" class="row-key">Provider run</text><text x="612" y="260" text-anchor="end" class="row-warn">NOT STARTED</text>
    <text x="28" y="302" class="source">EVIDENCE SOURCE  ·  Governed cloud eval receipt</text><rect x="28" y="326" width="584" height="74" rx="14" fill="#191d22"/>
    <text x="48" y="355" class="label">NEXT ACTION</text><text x="48" y="383" class="action">Complete local proof first</text><rect x="544" y="343" width="46" height="42" rx="11" fill="#252a31" stroke="#56606c"/><path d="M560 356h14v17h-14zM566 351h14v17" fill="none" stroke="#dce1e8" stroke-width="2.5"/>
  </g>

  <!-- Gate 7 -->
  <g transform="translate(60,1135)">
    <rect class="card" width="640" height="430" rx="24"/>
    <circle cx="45" cy="45" r="25" fill="#2a2113" stroke="#ffb520" stroke-width="3"/><text x="45" y="52" text-anchor="middle" class="row-warn" style="font-size:22px">7</text>
