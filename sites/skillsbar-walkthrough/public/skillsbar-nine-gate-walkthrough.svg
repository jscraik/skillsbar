    <text x="48" y="355" class="label">NEXT ACTION</text><text x="48" y="383" class="action">Prepare scorers</text><rect x="544" y="343" width="46" height="42" rx="11" fill="#252a31" stroke="#56606c"/><path d="M560 356h14v17h-14zM566 351h14v17" fill="none" stroke="#dce1e8" stroke-width="2.5"/>
  </g>

  <!-- Gate 5 -->
  <g transform="translate(760,665)">
    <rect class="card" width="640" height="430" rx="24"/>
    <circle cx="45" cy="45" r="25" fill="#2a2113" stroke="#ffb520" stroke-width="3"/><text x="45" y="52" text-anchor="middle" class="row-warn" style="font-size:22px">5</text>
    <text x="86" y="40" class="title">Eval local proof</text>
    <rect x="448" y="20" width="164" height="32" rx="16" fill="#342814" stroke="#ffb520"/><text x="530" y="42" text-anchor="middle" class="badge" fill="#ffb520">UNPROVEN</text>
    <text x="86" y="76" class="headline">No candidate-bound local eval receipt</text><line x1="28" y1="100" x2="612" y2="100" class="divider"/>
    <text x="28" y="130" class="label">NOW CHECKING</text>
    <text x="28" y="164" class="row-key">Eval profile</text><text x="612" y="164" text-anchor="end" class="row-value">oss-local</text>
    <text x="28" y="196" class="row-key">Candidate digest</text><text x="612" y="196" text-anchor="end" class="row-warn">REQUIRED</text>
    <text x="28" y="228" class="row-key">Scenario IDs</text><text x="612" y="228" text-anchor="end" class="row-value">must match preparation</text>
    <text x="28" y="260" class="row-key">Local result</text><text x="612" y="260" text-anchor="end" class="row-warn">NO RECEIPT</text>
    <text x="28" y="302" class="source">EVIDENCE SOURCE  ·  Governed local eval receipt</text><rect x="28" y="326" width="584" height="74" rx="14" fill="#191d22"/>
    <text x="48" y="355" class="label">NEXT ACTION</text><text x="48" y="383" class="action">Run local eval and save receipt</text><rect x="544" y="343" width="46" height="42" rx="11" fill="#252a31" stroke="#56606c"/><path d="M560 356h14v17h-14zM566 351h14v17" fill="none" stroke="#dce1e8" stroke-width="2.5"/>
  </g>

