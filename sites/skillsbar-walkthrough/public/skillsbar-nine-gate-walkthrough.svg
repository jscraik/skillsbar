    <text x="28" y="228" class="row-key">Scorer calibration</text><text x="612" y="228" text-anchor="end" class="row-red">MISSING</text>
    <text x="28" y="260" class="row-key">Scenario IDs</text><text x="612" y="260" text-anchor="end" class="row-value">canonical set recorded</text>
