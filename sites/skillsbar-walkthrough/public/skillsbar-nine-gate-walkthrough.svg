    <circle cx="45" cy="45" r="25" fill="#2a2113" stroke="#ffb520" stroke-width="3"/><text x="45" y="52" text-anchor="middle" class="row-warn" style="font-size:22px">4</text>
    <text x="86" y="40" class="title">Eval preparation</text>
