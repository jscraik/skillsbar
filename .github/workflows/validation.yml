name: Factory validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native macOS tests
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # Verified in actions/runner-images/images/macos/macos-15-Readme.md.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record revision and native toolchain
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/native
          {
            echo "PR head: $PR_HEAD_SHA"
            echo "Tested revision: $(git rev-parse HEAD)"
            echo "Event: $GITHUB_EVENT_NAME; ref: $GITHUB_REF"
            sw_vers
            uname -m
            xcodebuild -version
            xcrun swift --version
            xcrun --sdk macosx --show-sdk-version
          } | tee artifacts/native/environment.log
      - name: Build and test deterministic native fixtures
        run: |
          set -o pipefail
          # CI deliberately has no agent-skills checkout or Tessl credentials.
          unset SKILLSBAR_LIVE_INTEGRATION SKILLSBAR_REVIEW_FIXTURE
          swift build --build-system native --disable-sandbox 2>&1 | tee artifacts/native/build.log
          swift test --build-system native --disable-sandbox --filter ReviewPopoverTests 2>&1 | tee artifacts/native/rendering-tests.log
          swift test --build-system native --disable-sandbox 2>&1 | tee artifacts/native/tests.log
          echo "Deterministic review fixture; not live SDK or registry evidence" | tee artifacts/native/snapshot.log
          SKILLSBAR_REVIEW_FIXTURE=live .build/debug/SkillsProof --snapshot-dark --snapshot artifacts/native/fixture.png 2>&1 | tee -a artifacts/native/snapshot.log
      - name: Retain native proof and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native
          retention-days: 7
          if-no-files-found: warn

  site:
    name: Demo site tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites/skillsbar-walkthrough
    env:
      BROWSER_ARTIFACT_DIR: outputs/ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/skillsbar-walkthrough/package-lock.json
      - name: Record revision and web toolchain
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p outputs/ci
          {
            echo "PR head: $PR_HEAD_SHA"
            echo "Tested revision: $(git rev-parse HEAD)"
            echo "Event: $GITHUB_EVENT_NAME; ref: $GITHUB_REF"
            uname -a
            node --version
            npm --version
          } | tee outputs/ci/environment.log
      - name: Install locked dependencies and required Chrome channel
        run: |
          set -o pipefail
          npm ci 2>&1 | tee outputs/ci/install.log
          npx --no-install playwright-core install --with-deps chrome 2>&1 | tee outputs/ci/browser-install.log
          google-chrome --version | tee -a outputs/ci/environment.log
      - name: Lint, build and rendered-page tests
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee outputs/ci/lint.log
          # npm test already builds the production worker.
          npm test 2>&1 | tee outputs/ci/rendered-tests.log
      - name: Browser smoke against production server
        run: |
          set -o pipefail
          node scripts/test-browser-production.mjs 2>&1 | tee outputs/ci/browser-tests.log
      - name: Retain web proof and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}
          path: sites/skillsbar-walkthrough/outputs/ci
          retention-days: 7
          if-no-files-found: warn
