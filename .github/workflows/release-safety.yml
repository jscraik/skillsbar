name: Release safety

on:
  push:
    branches: [main, codex/release-safety]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-safety:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test debug behaviour and artifact rejection
        run: |
          swift test --build-system native --disable-sandbox
          python3 script/test_check_release.py
      - name: Test release behaviour
        run: swift test -c release --build-system native --disable-sandbox --filter ReleaseSafetyTests
      - name: Package and probe release without fixture overrides
        run: ./script/package_app.sh release "$RUNNER_TEMP/release-safety"
