<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#091119"/>
      <stop offset="1" stop-color="#10171b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1d2529"/>
      <stop offset="1" stop-color="#101719"/>
    </linearGradient>
    <linearGradient id="proposedPanel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#172228"/>
      <stop offset="1" stop-color="#0f1719"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; fill: #f4f7f8; }
      .mono { font-family: Courier, monospace; fill: #cbd4d7; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2.5px; fill: #8d9ba0; }
      .micro { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #8f9b9f; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #c8d1d3; }
      .row { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 600; fill: #eef2f3; }
      .green { fill: #70d78f; }
      .amber { fill: #ffba23; }
      .cyan { fill: #61d7df; }
      .muted { fill: #98a5a9; }
      .divider { stroke: #465154; stroke-opacity: .65; stroke-width: 1; }
      .round { stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1800" height="1220" fill="url(#canvas)"/>
  <text x="90" y="82" class="title" font-size="44" font-weight="700">SkillsBar — current vs proposed hybrid</text>
  <text x="90" y="120" class="body" fill="#a6b2b5">Preserve the compact operator surface; make the local-to-published story and evidence boundary visible before the score.</text>

  <!-- CURRENT -->
  <text x="128" y="190" class="label">CURRENT</text>
  <text x="128" y="218" class="micro">Current candidate-identity popover</text>
  <g filter="url(#shadow)">
    <rect x="90" y="250" width="720" height="810" rx="28" fill="url(#panel)" stroke="#607075" stroke-width="2"/>
  </g>
  <g transform="translate(120 280)">
    <rect width="46" height="46" rx="12" fill="#252d31" stroke="#68757a"/>
    <path d="M15 12h15l7 7v17H15zM30 12v8h7M20 27h12M20 33h9" fill="none" stroke="#e7edef" stroke-width="2.2" stroke-linecap="round"/>
    <text x="62" y="17" class="label" font-size="11">SKILLS SDK</text>
    <text x="62" y="40" class="body" font-size="17">jscraik/improve-agent-native</text>
    <rect x="285" y="25" width="51" height="21" rx="10" fill="#283035" stroke="#687277"/>
    <text x="295" y="40" class="label" font-size="9" fill="#bac5c7">LOCAL</text>
    <circle cx="652" cy="23" r="20" fill="#252d31" stroke="#495458"/>
    <text x="645" y="30" class="body" font-size="20">×</text>

    <text x="0" y="92" class="title" font-size="26" font-weight="700">Local candidate needs candidate identity</text>
    <circle cx="8" cy="117" r="4" fill="#ffba23"/>
    <text x="21" y="122" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Gate 1 of 9 · candidate identity</text>
    <text x="0" y="151" class="micro">1 receipt current · downstream proof held</text>
    <line x1="0" x2="660" y1="171" y2="171" class="divider"/>

    <text x="0" y="202" class="label" font-size="11">NEXT REQUIRED</text>
    <rect x="0" y="218" width="660" height="124" rx="14" fill="#171e20" stroke="#d99d00" stroke-width="2"/>
    <circle cx="38" cy="280" r="23" fill="#152023" stroke="#e3a400" stroke-width="2"/>
    <text x="31" y="287" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="18">1</text>
    <text x="77" y="259" class="row">Candidate identity</text>
    <text x="77" y="284" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Canonical package digest missing</text>
    <text x="77" y="310" class="micro">Candidate identity is required before downstream proof.</text>
    <rect x="488" y="259" width="145" height="43" rx="11" fill="#232b2e" stroke="#c78f00"/>
    <text x="504" y="286" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">COPY COMMAND</text>

    <text x="0" y="383" class="label" font-size="11">LOCAL PROOF</text>
    <circle cx="38" cy="426" r="23" fill="#151c1f" stroke="#86959a" stroke-width="2"/>
    <text x="32" y="433" class="body" font-size="17">1</text>
    <text x="77" y="419" class="row">1. Candidate identity</text>
    <text x="77" y="442" class="micro">Canonical package digest missing</text>
    <text x="502" y="419" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">REVIEW REQUIRED</text>
    <line x1="38" x2="38" y1="450" y2="476" stroke="#78868b" stroke-width="2"/>
    <circle cx="38" cy="498" r="23" fill="#151c1f" stroke="#6c787c" stroke-width="2"/>
    <text x="32" y="505" class="body" font-size="17">2</text>
    <text x="77" y="491" class="row">2. Mechanical validation</text>
    <text x="77" y="514" class="micro">Package verify passed · strict audit missing</text>
    <text x="549" y="491" class="micro">1 of 2 receipts</text>

    <rect x="0" y="552" width="660" height="158" rx="14" fill="#0e1d20" stroke="#008d95" stroke-width="2"/>
    <text x="20" y="581" class="label" font-size="11">PUBLISHED BASELINE</text>
    <rect x="20" y="598" width="46" height="46" rx="10" fill="#101719" stroke="#53656a"/>
    <path d="M32 610l11-6 11 6-11 6zM32 624l11 6 11-6M32 617l11 6 11-6" fill="none" stroke="#eef5f5" stroke-width="2" stroke-linejoin="round"/>
    <text x="81" y="616" class="row" font-size="17">Tessl</text>
    <text x="81" y="638" class="micro">v0.2.0 · declared version match</text>
    <text x="540" y="610" class="label" font-size="10">TESSL SCORE</text>
    <text x="557" y="652" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">66</text>
    <text x="20" y="681" class="green" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Quality 100%</text>
    <text x="236" y="681" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Impact 63%</text>
    <text x="450" y="681" class="green" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Security Passed</text>
    <text x="20" y="703" class="cyan" font-family="Arial, Helvetica, sans-serif" font-size="14">Version matches local · package identity unverified</text>

    <rect x="0" y="730" width="660" height="57" rx="12" fill="#1c2427" stroke="#5f6c70"/>
    <text x="20" y="754" class="row" font-size="16">Candidate identity command</text>
    <text x="20" y="777" class="mono" font-size="13">./bin/ask sdk start ./improve-agent-native --json --robot</text>
    <text x="620" y="765" class="body" font-size="26">▢</text>
  </g>

  <!-- PROPOSED -->
  <text x="992" y="190" class="label" fill="#61d7df">PROPOSED HYBRID</text>
  <text x="992" y="218" class="micro">Same utility density, clearer job and provenance</text>
  <g filter="url(#shadow)">
    <rect x="950" y="250" width="720" height="810" rx="28" fill="url(#proposedPanel)" stroke="#6f858a" stroke-width="2"/>
  </g>
  <g transform="translate(980 280)">
    <rect width="42" height="42" rx="11" fill="#252e31" stroke="#65777b"/>
    <path d="M13 10h14l7 7v16H13zM27 10v8h7M18 25h11M18 31h9" fill="none" stroke="#e7edef" stroke-width="2.1" stroke-linecap="round"/>
    <text x="56" y="15" class="label" font-size="11">SKILLS SDK</text>
    <text x="56" y="42" class="title" font-size="25" font-weight="700">Prove this skill before you publish</text>
    <rect x="56" y="55" width="253" height="20" rx="10" fill="#242d30" stroke="#5a6b6f"/>
    <text x="67" y="70" class="micro" font-size="12">jscraik/improve-agent-native · LOCAL</text>
    <circle cx="652" cy="21" r="20" fill="#252e31" stroke="#4c5d61"/>
    <text x="645" y="28" class="body" font-size="20">×</text>

    <circle cx="7" cy="102" r="4" fill="#ffba23"/>
    <text x="20" y="108" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">1 of 9 proofs · Held at candidate identity</text>
    <rect x="0" y="127" width="660" height="44" rx="11" fill="#122429" stroke="#2b747b"/>
    <text x="18" y="154" class="cyan" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Skills SDK verifies locally</text>
    <text x="281" y="154" class="muted" font-family="Arial, Helvetica, sans-serif" font-size="17">→</text>
    <text x="310" y="154" class="cyan" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Tessl publishes &amp; enables discovery</text>

    <text x="0" y="208" class="label" font-size="11">LOCAL PROOF</text>
    <rect x="0" y="223" width="660" height="131" rx="14" fill="#1b2020" stroke="#d99d00" stroke-width="2"/>
    <circle cx="38" cy="270" r="22" fill="#182124" stroke="#e3a400" stroke-width="2"/>
    <text x="32" y="277" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="17">1</text>
    <text x="77" y="254" class="row">Candidate identity</text>
    <text x="77" y="278" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Canonical package digest missing</text>
    <text x="77" y="305" class="micro">Create the package digest to bind downstream proof.</text>
    <text x="557" y="259" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">0 / 15</text>
    <text x="557" y="281" class="micro" font-size="12">held</text>
    <circle cx="38" cy="394" r="22" fill="#142021" stroke="#5e7479" stroke-width="2"/>
    <path d="M28 394l7 7 14-15" fill="none" stroke="#70d78f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="77" y="389" class="row">Mechanical validation</text>
    <text x="77" y="412" class="micro">1 of 2 receipts · strict audit is next</text>
    <text x="579" y="397" class="green" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">1 / 20</text>
    <circle cx="38" cy="455" r="22" fill="#151c1f" stroke="#637075" stroke-width="2"/>
    <path d="M31 455h14M38 448v14" stroke="#9aa6aa" stroke-width="2" stroke-linecap="round"/>
    <text x="77" y="450" class="row">Security review</text>
    <text x="77" y="473" class="micro">Awaiting candidate-bound receipt</text>
    <text x="600" y="458" class="micro">0 / 25</text>

    <rect x="0" y="506" width="660" height="168" rx="14" fill="#102023" stroke="#356c72" stroke-width="1.5"/>
    <text x="20" y="534" class="label" font-size="11" fill="#86bfc4">TESSL REGISTRY BASELINE</text>
    <text x="20" y="559" class="body" font-size="16">Published reference · exact package not yet matched</text>
    <rect x="20" y="578" width="79" height="21" rx="10" fill="#17343a" stroke="#4199a2"/>
    <text x="32" y="593" class="label" font-size="9" fill="#7debf3">TESSL LIVE</text>
    <text x="115" y="594" class="micro">v0.2.0 · declared version matches</text>
    <text x="556" y="568" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">66</text>
    <text x="556" y="588" class="label" font-size="9">SCORE</text>
    <text x="20" y="626" class="green" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Quality 100%</text>
    <text x="229" y="626" class="amber" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Impact 63%</text>
    <text x="420" y="626" class="green" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Security Passed</text>
    <text x="420" y="647" class="micro" font-size="12">Registry security by Snyk</text>
    <text x="20" y="657" class="cyan" font-family="Arial, Helvetica, sans-serif" font-size="14">Exact package comparison awaits the candidate digest.</text>

    <rect x="0" y="698" width="660" height="89" rx="13" fill="#20282a" stroke="#66767a"/>
    <text x="20" y="724" class="label" font-size="11">CREATE CANDIDATE DIGEST</text>
    <text x="20" y="748" class="micro">Canonical Skills SDK command · Copy only</text>
    <text x="20" y="774" class="mono" font-size="13">./bin/ask sdk start ./improve-agent-native --json --robot</text>
    <rect x="500" y="718" width="139" height="43" rx="11" fill="#253337" stroke="#799398"/>
    <text x="513" y="745" class="title" font-size="13" font-weight="700">COPY COMMAND</text>
  </g>

  <!-- Difference annotations -->
  <line x1="90" x2="1670" y1="1100" y2="1100" stroke="#425056" stroke-width="1"/>
  <text x="90" y="1145" class="label">DESIGN DELTA</text>
  <g>
    <rect x="290" y="1119" width="230" height="46" rx="23" fill="#17262a" stroke="#356f75"/>
    <text x="319" y="1148" class="cyan" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Goal-led headline</text>
    <rect x="545" y="1119" width="295" height="46" rx="23" fill="#17262a" stroke="#356f75"/>
    <text x="574" y="1148" class="cyan" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">SDK → Tessl relationship</text>
    <rect x="865" y="1119" width="280" height="46" rx="23" fill="#17262a" stroke="#356f75"/>
    <text x="890" y="1148" class="cyan" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Provenance before metrics</text>
    <rect x="1170" y="1119" width="274" height="46" rx="23" fill="#17262a" stroke="#356f75"/>
    <text x="1197" y="1148" class="cyan" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">One copy-only action</text>
  </g>
  <text x="90" y="1202" class="label" fill="#748084">CONCEPT MOCKUP — NOT RUNTIME EVIDENCE</text>
</svg>
